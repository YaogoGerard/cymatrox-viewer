[package]
name = "cymatrox-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Rendering + UI
bevy = "0.19.1"
bevy_material = "0.19"
bevy_egui = "0.42.0"
bevy_panorbit_camera = { version = "0.35", features = ["bevy_egui"] }

# Simulation
cymatrox = "0.2"

# Audio (voice control)
cpal = "0.18"
realfft = "3.5"
num-complex = "0.4"

# Thread communication
crossbeam-channel = "0.5"

# Async runtime for cymatrox's GpuContext::new().await
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"

# Packaging configuration for cargo-packager.
# https://docs.crabnebula.dev/packager/
[package.metadata.packager]
product-name = "Cymatrox Viewer"
identifier = "io.github.yaogogerard.cymatrox-viewer"
description = "Interactive cymatics laboratory — visualize granular and fluid simulations"
authors = ["Gerard"]
homepage = "https://github.com/YaogoGerard/cymatrox-viewer"
license-file = "LICENSE"
icons = ["build/icons/icon.png", "build/icons/icon@2x.png"]
out-dir = "dist"
# Only ship the app itself: without this, cargo-packager packages every
# bin target, which would bundle the `gpu_smoke` dev tool (~180 MB).
binaries = [{ path = "cymatrox-viewer", main = true }]

[package.metadata.packager.deb]
depends = ["libasound2", "libudev1"]
section = "science"
priority = "optional"

[package.metadata.packager.nsis]
installMode = "currentUser"

[package.metadata.packager.dmg]
window-size = { width = 500, height = 400 }
background = "build/icons/dmg-background.png"
