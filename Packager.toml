# Packager configuration for cymatrox-viewer
# https://docs.crabnebula.dev/packager/

[package.metadata.packager]
product-name = "Cymatrox Viewer"
identifier = "io.github.yaogogerard.cymatrox-viewer"
description = "Interactive cymatics laboratory — visualize granular, fluid and acoustic simulations"
authors = ["Gerard"]
homepage = "https://github.com/YaogoGerard/cymatrox-viewer"
license-file = false
before-packaging-command = "cargo build --release"

icons = [
  "build/icons/icon.png",
]

format = [
  "deb",
  "appimage",
  "nsis",
  "dmg",
]

# Linux
[package.metadata.packager.deb]
depends = ["libasound2", "libudev1"]
section = "science"
priority = "optional"
desktop-file = "build/desktop/cymatrox-viewer.desktop"

[package.metadata.packager.appimage]
# AppImage: updater works with AppImage format only on Linux
files = []

# Windows
[package.metadata.packager.nsis]
app-name = "Cymatrox Viewer"
install-mode = "passive"
allow-downgrades = true

# macOS
[package.metadata.packager.dmg]
app-name = "Cymatrox Viewer"
title = "Cymatrox Viewer"
window-size = { width = 500, height = 400 }
icon-size = 80
background = "build/icons/dmg-background.png"
# Notarization/signing skipped (dmg non signé per request)

[[package.metadata.packager.dmg.contents]]
x = 100
y = 150
type = "file"
path = "/Applications/Cymatrox Viewer.app"

[[package.metadata.packager.dmg.contents]]
x = 400
y = 150
type = "link"
path = "/Applications"
