name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: "deb,appimage"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: "nsis"
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: "dmg"
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: "dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --verbose

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --verbose

      - name: Package (macOS x86_64)
        if: matrix.os == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --verbose

      - name: Package (macOS aarch64)
        if: matrix.os == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --verbose

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
